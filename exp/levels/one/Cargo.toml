[package]
name = "one"
version = "0.0.0"
edition = "2021"

[dependencies]
# unmodified libdeflate master
gzlocal = { path = "../../../gzlocal", features = ["stock"] }
fastgzip = { path = "../fastgzip" }
# the levels as they were measured before large payloads got searches of
# their own
before = { package = "fastgzip", path = "../before" }

[profile.release]
debug = 1
