[package]
name = "ab"
version = "0.0.0"
edition = "2021"

[dependencies]
# unmodified libdeflate master
gzlocal = { path = "../../../gzlocal", features = ["stock"] }
fastgzip = { path = "../fastgzip" }
# the levels as they were last measured
before = { package = "fastgzip", path = "../before" }
# reads back what the working copy writes
flate2 = "1"

[profile.release]
debug = 1
