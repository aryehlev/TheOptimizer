[package]
name = "fastgzip-safe"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Fast gzip for streams of small, similar payloads: shared Huffman codes, one pass"
license = "MIT"
repository = "https://github.com/aryehlev/fastgzip"
readme = "README.md"
keywords = ["gzip", "deflate", "compression"]
categories = ["compression"]

[features]
# On arm64, fetch the encoder's machine code ahead of its use.  Worth a few
# percent when the thread did other work since its last payload; it is the
# one thing here that takes an `unsafe` block.  Without it the crate forbids
# unsafe code.
prefetch = []
# An experiment, not for use: see `Gzip::compress`.
zerofirst = []

[dependencies]
crc32fast = "1.5"

[dev-dependencies]
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

# `cargo test --profile checked`, `cargo run --profile checked --example stress`:
# optimized, with every assertion on and every overflow checked.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.release]
debug = 1
